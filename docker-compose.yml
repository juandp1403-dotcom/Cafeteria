version: '3.8'

services:
  cafeteria-cgao:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cafeteria-cgao
    restart: unless-stopped
    ports:
      - "3589:3589"
    environment:
      - NODE_ENV=production
      - PORT=3589
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
    env_file:
      - path: .env
        required: false
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3589/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
